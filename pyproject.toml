[project]
name = "microagents-rag"
version = "0.1.0"
description = "FastAPI-based RAG service backed by SiliconFlow and Chroma."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.131.0",
    "langchain-chroma",
    "langchain-openai",
    "langchain-text-splitters",
    "pydantic~=2.12.5",
    "pybloom-live",
    "requests~=2.31.0",
    "uvicorn~=0.41.0",
]

[tool.uv]
package = false
